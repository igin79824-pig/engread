  <script>
    const curriculumData = {

        { id: "7A", title: "七上", label: "七年級上學期", active: false },
        { id: "7B", title: "七下", label: "七年級下學期", active: false },

          { id: "cat8A_2", title: "睡眠生活與家事 (Sleep & Daily Routine)", icon: "fa-bed", desc: "涵蓋夢境、夢遊、家務分擔與調適焦慮情緒的生活題材。" },
          { id: "cat8A_3", title: "克漏字文法素養評量 (Cloze Test Focus)", icon: "fa-pen-to-square", desc: "強化過去進行式、動名詞作主詞及動詞搭配之篇章測驗。" }
        ],
        "8B": [],
        "9A": [],
        "9B": []
      },
      // Class 1109 完整 20 篇篇章資料庫
      articles: [
        /* 類別一：未來職業與夢想 */
        {
          id: "art-1109-1",
          semesterId: "8A",
          categoryId: "cat8A_1",
          page: "Page 1-3",
          title: "A Dream at Night",
          wordCount: 130,
          extraVocab: ["light (n.; v.燈;光;點亮)", "smart (adj.聰明的)", "test (n.考試)", "wish (n.; v.祝福;願望)"],
          passage: `It is easy to fall asleep at half past ten.
Closing your eyes is a good idea for you.
It is right to put your problems away then.
Sleeping well helps you start the day new.
I was resting, and someone broke the dishes.
I was dreaming about a farmer and a fisherman.
They were catching fish and making wishes.
I plan to be a lawyer, and that is my plan.
Getting butterflies in my stomach is terrible.
I worry about my future job and test.
However, keeping a quiet mind is possible.
It is smart to take a good rest.
Finally, I was sleeping through the night.
Then, my pet left the bedroom floor.
I hope to catch a dream of light,
And sleepwalk down the stairs no more.`,
          questions: [
            { q: "What is the poem mainly about?", options: ["(A) How to become a lawyer in the city.", "(B) The importance of a good night's rest.", "(C) The best way to catch fish in the sea.", "(D) Why pets like to sleep on the floor."], ans: "(B)", explain: "詩歌主要強調將煩惱放下、好好睡個好覺並保持平靜心情的重要性。" },
            { q: "What happened while the writer was resting?", options: ["(A) A farmer caught a fish.", "(B) Someone broke the dishes.", "(C) The pet walked down the stairs.", "(D) A lawyer called on the phone."], ans: "(B)", explain: "詩中明確提及：'I was resting, and someone broke the dishes.'" },
            { q: "Why does the writer have \"butterflies in my stomach\"?", options: ["(A) The writer is worried about future plans.", "(B) The writer is sick and needs a doctor.", "(C) The writer ate a terrible bug for dinner.", "(D) The writer feels hungry before going to bed."], ans: "(A)", explain: "文中接著提到：'I worry about my future job and test.'，因此表示對未來感到焦慮與緊張。" },
            { q: "In the poem, what does \"put your problems away\" mean?", options: ["(A) To stop worrying about difficult things.", "(B) To hide your homework under the bed.", "(C) To keep your ideas in a small drawer.", "(D) To throw your books into the trash."], ans: "(A)", explain: "put your problems away 意指將難題先擱置一旁，不再擔憂難解之事。" },
            { q: "How does the poem end?", options: ["(A) With a hope for a good dream and safe sleep.", "(B) With a terrible feeling about a new job.", "(C) With a story about a fisherman and his pet.", "(D) With a plan to clean the broken dishes."], ans: "(A)", explain: "結尾提到希望捕捉到光明美夢，且不再夢遊走下樓梯，象徵對安穩好眠的企盼。" }
          ]
        },
        {
          id: "art-1109-2",
          semesterId: "8A",
          categoryId: "cat8A_1",
          page: "Page 4-6",
          title: "Homework on Future Plans",
          wordCount: 291,
          extraVocab: ["choose (v.選擇)", "common (adj.常見的;共同的)", "forward (adv.向前)", "have to (phr.必須)", "instead (adv.作為替代)", "noise (n.聲響;噪音)", "suddenly (adv.突然)", "topic (n.主題)"],
          passage: `It was half past six yesterday evening. I was mopping the stairs. My sister was wiping the window. Suddenly, we heard a terrible noise. Someone broke some dishes! I ran into the kitchen. My sister was crying. Fixing the problem was not easy. It took a quarter of an hour to sweep the floor and dry it. We also had to fix the drawer and close a hole in the wall.

After that, I went to feed my pet. I didn't leave my room to hang clothes. Instead, I looked at my computer monitor. I was almost falling asleep. Suddenly, I remembered my homework. The topic was about our future plan. I got butterflies in my stomach. Worrying about the future is common for junior high school students. It is hard to choose the right job.

I thought about many jobs. Being a dentist is cool. However, I am scared of teeth. My uncle is a truck driver. He drives through the city every day. My aunt is a secretary at a factory. Her boss is a salesman. I want to do something different. I hope to be a reporter. Interviewing people is a good tip to learn about the world. I can talk to a lawyer, a mail carrier, a soldier, or a farmer. A farmer grows food for our country. Maybe I can interview a fisherman. I can also interview a young boy. He sleepwalks at night!

I wrote down my ideas on the web. I put one idea in my notebook to save it. Finally, I finished my homework. I had nothing to worry about. It is a good idea to keep hoping for the future. I will move forward and study hard to catch my dream.`,
          questions: [
            { q: "What is the main idea of the reading?", options: ["(A) The writer is thinking about a future job.", "(B) The writer is looking for a pet.", "(C) The writer wants to learn to cook food.", "(D) The writer plans to move to a new city."], ans: "(A)", explain: "文章核心圍繞在作者做完家事後思考未來作業題目，思索各種未來的職業選擇。" },
            { q: "Which job does the writer NOT mention in the reading?", options: ["(A) A dentist.", "(B) A truck driver.", "(C) A police officer.", "(D) A reporter."], ans: "(C)", explain: "文中提到了牙醫、卡車司機、秘書、銷售員、記者、律師、郵差、軍人、農夫等，唯獨沒有提到警察 (police officer)。" },
            { q: "Why does the writer want to be a reporter?", options: ["(A) The writer wants to talk to people and learn about the world.", "(B) The writer wants to work in a factory.", "(C) The writer likes to sleepwalk at night.", "(D) The writer is scared of teeth."], ans: "(A)", explain: "文中提到：'Interviewing people is a good tip to learn about the world.'" },
            { q: "In the reading, the writer says, \"I got butterflies in my stomach.\" What does this mean?", options: ["(A) The writer felt very hungry.", "(B) The writer felt a little nervous.", "(C) The writer ate a bad bug.", "(D) The writer had a terrible stomachache."], ans: "(B)", explain: "butterflies in one's stomach 常用來表達緊張、不安的心理狀態。" },
            { q: "How does the writer feel about the future at the end of the reading?", options: ["(A) The writer is sad about the dishes.", "(B) The writer is very tired and wants to sleep.", "(C) The writer is angry about the homework.", "(D) The writer has hope and wants to study hard."], ans: "(D)", explain: "文末指出：'It is a good idea to keep hoping for the future. I will move forward and study hard to catch my dream.'" }
          ]
        },
        {
          id: "art-1109-3",
          semesterId: "8A",
          categoryId: "cat8A_1",
          page: "Page 7-9",
          title: "A Letter About Future Plans (Kevin to Tom)",
          wordCount: 169,
          extraVocab: ["downstairs (adv.在樓下;往樓下)", "noise (n.聲響;噪音)", "smile (n.; v.微笑)"],
          passage: `Dear Tom,

How are you? We are junior high school students now. I am writing to tell you about my future plan. It is easy to worry about the future. I get butterflies in my stomach! I hope to find a good job.

Yesterday afternoon, I was wiping the window, and someone broke some dishes downstairs. The noise scared me, and I almost fell! However, it gave me an idea. I want to help people. Being a lawyer is a cool idea, but I do not want to fix terrible problems. Being a truck driver is fun, but driving a truck through the city is hard. My uncle is a farmer. He grows fruit. My aunt is a reporter. She likes to interview people.

Finally, I want to be a dentist. It is great to save bad teeth. I was telling my mom about my dream, and she smiled. What is your dream job? Do you want to be a boss or a salesman? Please write back.

Yours,
Kevin`,
          questions: [
            { q: "What is the main idea of the letter?", options: ["(A) Kevin's uncle is a great farmer.", "(B) Kevin wants to share his dream job.", "(C) Kevin broke some dishes downstairs.", "(D) Kevin's aunt likes to interview people."], ans: "(B)", explain: "Kevin 寫這封信是為了跟 Tom 分享自己對未來夢想職業的思考過程。" },

    // Level 5: Interactive Quiz Builder (點選後才呈現答案與解析)
    function renderQuizQuestions(art) {
      if (!art.questions || art.questions.length === 0) {
        return `<p class="text-sm text-slate-400 italic">本篇章尚無內建測驗題。</p>`;
      }

      const answeredMap = userAnswers[art.id] || {};

      return art.questions.map((qObj, qIdx) => {
        const userChoice = answeredMap[qIdx];
        const isAnswered = userChoice !== undefined;
        const correctOptLetter = qObj.ans.replace(/[\(\)]/g, '').trim();
        const isCorrect = isAnswered && userChoice.startsWith(`(${correctOptLetter})`);

        return `
          <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs transition">
            <div class="flex items-start gap-2 mb-2.5">
              <span class="w-5 h-5 rounded bg-indigo-50 text-indigo-600 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">
                ${qIdx + 1}
              </span>
              <p class="font-bold text-slate-900 text-xs sm:text-sm leading-snug">${qObj.q}</p>
            </div>

            <!-- Options List -->
            <div class="space-y-1.5 pl-7">
              ${qObj.options.map(opt => {
                const optLetter = opt.substring(1, 2);
                let optStyle = "border-slate-200 hover:bg-slate-50 text-slate-700";

                if (isAnswered) {
                  const isThisSelected = userChoice === opt;
                  const isThisCorrect = optLetter === correctOptLetter;

                  if (isThisCorrect) {
                    optStyle = "bg-emerald-50 border-emerald-400 text-emerald-800 font-semibold";
                  } else if (isThisSelected && !isCorrect) {
                    optStyle = "bg-rose-50 border-rose-400 text-rose-800 line-through";
                  } else {
                    optStyle = "opacity-50 border-slate-200 text-slate-400";
                  }
                }

                return `
                  <button type="button" 
                    onclick="handleOptionClick('${art.id}', ${qIdx}, '${opt.replace(/'/g, "\\'")}')" 
                    class="w-full text-left p-2.5 rounded-lg border text-xs sm:text-sm transition-all duration-150 flex items-center justify-between ${optStyle}">
                    <span>${opt}</span>
                    ${isAnswered && optLetter === correctOptLetter ? '<i class="fa-solid fa-circle-check text-emerald-600 ml-2"></i>' : ''}
                    ${isAnswered && userChoice === opt && !isCorrect ? '<i class="fa-solid fa-circle-xmark text-rose-600 ml-2"></i>' : ''}
                  </button>
                `;
              }).join("")}
            </div>

            <!-- Answer Feedback & Explanation (點選選項後才呈現) -->
            ${isAnswered ? `
              <div class="mt-3 pl-7">
                <div class="p-3 rounded-lg border ${isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-amber-50/70 border-amber-200'}">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-[11px] font-bold px-1.5 py-0.5 rounded ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
                      ${isCorrect ? '✓ 答對了！' : '✗ 答錯了！'}
                    </span>
                    <span class="text-xs font-semibold text-slate-700">正確解答：${qObj.ans}</span>
                  </div>
                  <p class="text-xs text-slate-600 leading-relaxed">
                    <i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i>
                    <strong class="text-slate-800">解析：</strong>${qObj.explain || "請依據前後文線索判斷關鍵文意。"}
                  </p>
                </div>
              </div>
            ` : ''}

          </div>
        `;
      }).join("");
    }

    window.handleOptionClick = function(articleId, questionIndex, selectedOption) {
      if (!userAnswers[articleId]) userAnswers[articleId] = {};
      userAnswers[articleId][questionIndex] = selectedOption;

      const art = curriculumData.articles.find(a => a.id === articleId);
      if (art) {
        document.getElementById("quiz-list-container").innerHTML = renderQuizQuestions(art);
      }
    };

    window.resetQuiz = function(articleId) {
      if (userAnswers[articleId]) {
        delete userAnswers[articleId];
        const art = curriculumData.articles.find(a => a.id === articleId);
        if (art) {
          document.getElementById("quiz-list-container").innerHTML = renderQuizQuestions(art);
        }
      }
    };

    function wrapPassageSentences(text) {
      if (!text) return "";
      const sentenceRegex = /([^.?!]+[.?!]+)/g;
      let counter = 0;
      return text.replace(sentenceRegex, (match) => {
        const id = `sentence-${counter++}`;
        return `<span id="${id}" class="sentence-token transition-colors duration-150">${match}</span>`;
      });
    }

    // Audio Playback Controls
    window.handlePlayToggle = function() {
      const art = curriculumData.articles.find(a => a.id === activeArticleId);
      if (!art) return;

      if (audioState.mode === 'tts') {
        toggleTTS(art);
      } else {
        toggleNativeAudio();
      }
    };

    function toggleTTS(art) {
      if (!('speechSynthesis' in window)) {
        alert("瀏覽器暫不支援 Web Speech 語音合成。");
        return;
      }

      if (window.speechSynthesis.paused && audioState.isPaused) {
        window.speechSynthesis.resume();
        audioState.isPaused = false;
        audioState.isPlaying = true;
        updateAudioUI(true);
        return;
      }

      if (window.speechSynthesis.speaking && audioState.isPlaying) {
        window.speechSynthesis.pause();
        audioState.isPaused = true;
        audioState.isPlaying = false;
        updateAudioUI(false, true);
        return;
      }

      window.speechSynthesis.cancel();
      clearHighlight();

      const utterance = new SpeechSynthesisUtterance(art.passage);
      utterance.lang = "en-US";
      utterance.rate = audioState.rate || 1.0;
      if (audioState.selectedVoice) utterance.voice = audioState.selectedVoice;

      utterance.onboundary = function(event) {
        if (event.name === 'sentence' || event.name === 'word') {
          highlightSentenceAtChar(art.passage, event.charIndex);
        }
      };

      utterance.onstart = function() {
        audioState.isPlaying = true;
        audioState.isPaused = false;
        updateAudioUI(true);
      };

      utterance.onend = function() {
        audioState.isPlaying = false;
        audioState.isPaused = false;
        updateAudioUI(false);
        clearHighlight();
      };

      utterance.onerror = function() {
        audioState.isPlaying = false;
        audioState.isPaused = false;
        updateAudioUI(false);
        clearHighlight();
      };

      window.speechSynthesis.speak(utterance);
    }

    function toggleNativeAudio() {
      const audioEl = document.getElementById("native-audio");
      if (!audioEl || !audioEl.src || audioEl.src === window.location.href) {
        switchAudioMode('tts');
        const art = curriculumData.articles.find(a => a.id === activeArticleId);
        if (art) toggleTTS(art);
        return;
      }

      audioEl.playbackRate = audioState.rate || 1.0;

      if (audioEl.paused) {
        audioEl.play().then(() => {
          audioState.isPlaying = true;
          audioState.isPaused = false;
          updateAudioUI(true);
        });
        audioEl.onended = () => {
          audioState.isPlaying = false;
          audioState.isPaused = false;
          updateAudioUI(false);
        };
      } else {
        audioEl.pause();
        audioState.isPlaying = false;
        audioState.isPaused = true;
        updateAudioUI(false, true);
      }
    }

    window.stopAudio = function() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const audioEl = document.getElementById("native-audio");
      if (audioEl) {
        audioEl.pause();
        audioEl.currentTime = 0;
      }
      audioState.isPlaying = false;
      audioState.isPaused = false;
      updateAudioUI(false);
      clearHighlight();
    };

    window.changePlaybackSpeed = function(speed) {
      audioState.rate = speed;
      [0.75, 1.0, 1.25].forEach(s => {
        const idKey = s.toString().replace('.', '');
        const btn = document.getElementById(`speed-${idKey}`);
        if (btn) {
          btn.className = (s === speed) 
            ? "px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[11px]" 
            : "px-1.5 py-0.5 rounded text-slate-600 hover:text-indigo-600 text-[11px]";
        }
      });

      if (audioState.isPlaying && audioState.mode === 'tts') {
        const art = curriculumData.articles.find(a => a.id === activeArticleId);
        if (art) {
          window.speechSynthesis.cancel();
          toggleTTS(art);
        }
      } else {
        const audioEl = document.getElementById("native-audio");
        if (audioEl) audioEl.playbackRate = speed;
      }
    };

    window.handleFileUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const objectUrl = URL.createObjectURL(file);
      const audioEl = document.getElementById("native-audio");
      if (audioEl) {
        audioEl.src = objectUrl;
        audioState.mode = 'custom';
        alert(`已掛載音檔：${file.name}，可點擊播放！`);
      }
    };

    function updateAudioUI(isPlaying, isPaused = false) {
      const playBtn = document.getElementById("play-btn");
      const soundwave = document.getElementById("soundwave");
      if (!playBtn) return;

      const btnText = playBtn.querySelector(".btn-text");
      const icon = playBtn.querySelector("i");

      if (isPlaying) {
        playBtn.className = "inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium text-xs transition shadow-xs";
        btnText.textContent = "暫停";
        icon.className = "fa-solid fa-pause text-xs";
        if (soundwave) soundwave.classList.remove("hidden"), soundwave.classList.add("flex");
      } else if (isPaused) {
        playBtn.className = "inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs transition shadow-xs";
        btnText.textContent = "繼續";
        icon.className = "fa-solid fa-play text-xs";
        if (soundwave) soundwave.classList.add("hidden"), soundwave.classList.remove("flex");
      } else {
        playBtn.className = "inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs transition shadow-xs";
        btnText.textContent = "朗讀";
        icon.className = "fa-solid fa-play text-xs";
        if (soundwave) soundwave.classList.add("hidden"), soundwave.classList.remove("flex");
      }
    }

    function highlightSentenceAtChar(fullText, charIndex) {
      const container = document.getElementById("text-container");
      if (!container) return;
      const tokens = container.querySelectorAll(".sentence-token");
      let accumLength = 0;
      tokens.forEach((span) => {
        const textLength = span.textContent.length;
        if (charIndex >= accumLength && charIndex < accumLength + textLength) {
          span.classList.add("reading-highlight");
        } else {
          span.classList.remove("reading-highlight");
        }
        accumLength += textLength;
      });
    }

    function clearHighlight() {
      const container = document.getElementById("text-container");
      if (!container) return;
      container.querySelectorAll(".sentence-token").forEach(span => span.classList.remove("reading-highlight"));
    }

    // Modal Handler
    addArticleModalBtn.addEventListener("click", () => {
      document.getElementById("modal-semester").value = currentSemesterId;
      addModal.classList.remove("hidden");
    });
    closeModalBtn.addEventListener("click", () => addModal.classList.add("hidden"));
    cancelModalBtn.addEventListener("click", () => addModal.classList.add("hidden"));

    addArticleForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const sem = document.getElementById("modal-semester").value;
      const cat = document.getElementById("modal-category").value;
      const title = document.getElementById("modal-title").value.trim();
      const page = document.getElementById("modal-page").value.trim() || "自訂篇章";
      const words = parseInt(document.getElementById("modal-words").value, 10) || 120;
      const vocabRaw = document.getElementById("modal-vocab").value.trim();
      const audioUrl = document.getElementById("modal-audio-url").value.trim();
      const content = document.getElementById("modal-content").value.trim();

      const vocabList = vocabRaw ? vocabRaw.split(",").map(s => s.trim()).filter(Boolean) : [];

      const newArticle = {
        id: "art-" + Date.now(),
        semesterId: sem,
        categoryId: cat,
        page: page,
        title: title,
        wordCount: words,
        audioUrl: audioUrl || null,
        extraVocab: vocabList,
        passage: content,
        questions: [
          {
            q: "What is the main topic of the reading?",
            options: ["(A) A story about friends.", "(B) General discussion.", "(C) Personal reflection.", "(D) Daily activities."],
            ans: "(B)",
            explain: "根據文章主要語意與主旨進行判斷。"
          }
        ]
      };

      curriculumData.articles.unshift(newArticle);

      currentSemesterId = sem;
      currentCategoryId = cat;
      activeArticleId = newArticle.id;

      renderSemesterTabs();
      renderCategoryTabs();
      renderArticleTabsAndContent();

      addArticleForm.reset();
      addModal.classList.add("hidden");
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderArticleTabsAndContent();
    });

    window.onload = function() {
      renderSemesterTabs();
      renderCategoryTabs();
      renderArticleTabsAndContent();
    };
  </script>
</body>
</html>
